name = "pawsling-leaderboard"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGIN = "https://vitaliivepsha.github.io"
WEBAPP_URL = "https://vitaliivepsha.github.io/pawsling/webapp/?v=2"

# `npx wrangler d1 create pawsling` prints the id to put here
[[d1_databases]]
binding = "DB"
database_name = "pawsling"
database_id = "99e9edcc-af34-4d5a-a001-f4699750094d"

# Monday 00:05 UTC: prizes for the week that just ended; every hour: raid alerts
[triggers]
crons = ["5 0 * * 1", "0 * * * *"]

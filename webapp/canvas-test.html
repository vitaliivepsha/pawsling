<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Canvas test</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#110e22;color:#f4efe6;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  p{position:fixed;left:12px;top:8px;margin:0;font-size:14px}
</style>
</head>
<body>
<!-- The smallest possible canvas animation, with none of the game's code: if this page is black
     or flickers, the browser itself fails on this device. -->
<canvas id="c"></canvas>
<p id="t">Кадрів: 0</p>
<script>
var c = document.getElementById('c'), x = c.getContext('2d'), t = document.getElementById('t'), n = 0;
function size() { c.width = innerWidth; c.height = innerHeight; }
addEventListener('resize', size); size();
function frame(ms) {
  n++;
  x.fillStyle = '#231d3f'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#ffc857';
  x.beginPath(); x.arc(c.width / 2 + Math.cos(ms / 500) * c.width / 3, c.height / 2 + Math.sin(ms / 700) * c.height / 3, 30, 0, Math.PI * 2); x.fill();
  if (n % 30 === 0) t.textContent = 'Кадрів: ' + n;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Pawsling</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15122a">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@900&family=Nunito:wght@700;800;900&display=swap">
<style>
  html,body{height:100%;margin:0;background:#110e22;color:#f4efe6;font-family:Nunito,system-ui,sans-serif}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-weight:800}
  #boot button{margin-top:12px;font:inherit;padding:10px 20px;border-radius:12px;border:0;background:#ffc857;color:#15122a}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Гра Pawsling. Потягни від героя назад і відпусти, щоб запустити його, як з рогатки."></canvas>
<div id="boot" role="status">Завантаження…</div>
<!--
  This page only loads the game. Telegram's WebView caches pages hard, so the game's own files
  are requested with a fresh query string on every launch: a push to main reaches players at once.
-->
<script>
(function () {
  var v = Date.now(), boot = document.getElementById('boot');
  function fail() {
    boot.innerHTML = 'Не вдалося завантажити гру.<br>Перевір інтернет.<br><button type="button" onclick="location.reload()">Спробувати ще</button>';
  }
  var css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = 'game.css?v=' + v;
  css.onload = css.onerror = function () {
    var js = document.createElement('script');
    js.src = 'game.js?v=' + v;
    js.onload = function () { boot.remove(); };
    js.onerror = fail;
    document.body.appendChild(js);
  };
  document.head.appendChild(css);
})();
</script>
</body>
</html>

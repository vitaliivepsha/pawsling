<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Pawsling · діагностика</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@900&family=Nunito:wght@700;800;900&display=swap">
<style>
  html,body{height:100%;margin:0;background:#110e22;color:#f4efe6;font-family:Nunito,system-ui,sans-serif}
  #panel{position:fixed;inset:0;z-index:9;overflow:auto;background:#110e22;padding:16px;box-sizing:border-box;font-size:14px;line-height:1.4}
  #panel h1{font-family:Rubik,sans-serif;font-size:22px;margin:0 0 8px;color:#ffc857}
  #panel pre{white-space:pre-wrap;word-break:break-word;background:#1d1938;padding:10px;border-radius:10px;font-size:12px}
  #panel label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #2a2548}
  #panel input{width:22px;height:22px}
  #panel button{margin-top:14px;width:100%;font:inherit;font-weight:900;padding:14px;border-radius:12px;border:0;background:#ffc857;color:#15122a}
  #hud{position:fixed;left:6px;top:6px;z-index:8;font:11px monospace;background:rgba(0,0,0,.55);color:#9fd8e0;padding:3px 6px;border-radius:6px;pointer-events:none}
</style>
</head>
<body>
<!--
  Diagnostics for the game on phones. It runs the same game.js, can switch heavy canvas features off
  by patching the canvas API from outside, and keeps a heartbeat in localStorage so that after a crash
  the next visit shows how far the previous run got.
-->
<canvas id="game" tabindex="0"></canvas>
<div id="hud"></div>
<div id="panel">
  <h1>Pawsling · діагностика</h1>
  <div id="prev"></div>
  <pre id="info"></pre>
  <div>Залиш увімкненим тільки те, що хочеш перевірити:</div>
  <label><input type="checkbox" id="f-rooms" checked> Великі фони кімнат</label>
  <label><input type="checkbox" id="f-lighter" checked> Світіння (режим «lighter»)</label>
  <label><input type="checkbox" id="f-shadow" checked> Тіні й розмиття (shadowBlur)</label>
  <label><input type="checkbox" id="f-grad" checked> Радіальні градієнти</label>
  <label><input type="checkbox" id="f-dpr" checked> Висока роздільність екрана</label>
  <div style="margin-top:12px">Як запускати:</div>
  <label><input type="checkbox" id="f-cssfirst"> Спершу стилі, потім гра (як у справжній грі)</label>
  <label><input type="checkbox" id="f-auto"> Одразу при відкритті сторінки, без кнопки (як у справжній грі)</label>
  <button type="button" id="go">Запустити гру</button>
</div>
<script>
(function () {
  var LS = 'pawsling-diag', FLAGS = ['rooms', 'lighter', 'shadow', 'grad', 'dpr', 'cssfirst', 'auto'];
  function get() { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } }
  function put(o) { try { localStorage.setItem(LS, JSON.stringify(o)); } catch (e) {} }

  var p = get(), prev = document.getElementById('prev');
  if (p) {
    var off = FLAGS.slice(0, 5).filter(function (f) { return !p.flags[f]; });
    prev.innerHTML = '<pre></pre>';
    prev.firstChild.textContent = 'Попередній запуск: протримався ' + p.alive + ' с, кадрів: ' + p.frames +
      (p.done ? ' (закрито нормально)' : ' (обірвався — можливо, падіння)') +
      '\nВимкнено: ' + (off.length ? off.join(', ') : 'нічого') +
      '\nЗапуск: ' + (p.flags.cssfirst ? 'спершу стилі' : 'стилі й гра разом') + ', ' + (p.flags.auto ? 'одразу при відкритті' : 'кнопкою') +
      (p.flags.preset ? '\nПосилання: ' + p.flags.preset : '') +
      '\nПолотно: ' + (p.canvas || '?') + (p.err ? '\nПомилка: ' + p.err : '');
    FLAGS.forEach(function (f) { document.getElementById('f-' + f).checked = !!p.flags[f]; });
  }
  // ?run&… links start at once with every visual feature on and only the launch details changed:
  // css=1 styles before the game, boot=1 the game's "Завантаження…" overlay, webgl=1 the GPU probe,
  // raf=1 the frame counter, hud=1 the counter label
  var q = new URLSearchParams(location.search), preset = null;
  if (q.has('run')) {
    preset = { rooms: true, lighter: true, shadow: true, grad: true, dpr: true, auto: true, preset: location.search };
    ['css', 'boot', 'webgl', 'raf', 'hud'].forEach(function (k) { preset[k === 'css' ? 'cssfirst' : k] = q.get(k) === '1'; });
  }
  var gl = 'не перевірялось';
  if (!preset || preset.webgl) try {
    var g = document.createElement('canvas').getContext('webgl'), ext = g && g.getExtension('WEBGL_debug_renderer_info');
    gl = ext ? g.getParameter(ext.UNMASKED_RENDERER_WEBGL) : (g ? 'webgl ok' : 'no webgl');
  } catch (e) { gl = 'webgl error'; }
  var tg = window.Telegram && Telegram.WebApp;
  document.getElementById('info').textContent = [
    'UA: ' + navigator.userAgent,
    'Екран: ' + screen.width + '×' + screen.height + ', DPR ' + window.devicePixelRatio + ', вікно ' + innerWidth + '×' + innerHeight,
    'Памʼять пристрою: ' + (navigator.deviceMemory || '?') + ' ГБ, ядер: ' + (navigator.hardwareConcurrency || '?'),
    'GPU: ' + gl,
    'Telegram: ' + (tg && tg.initData ? tg.platform + ' ' + tg.version : 'ні (звичайний браузер)'),
  ].join('\n');
  try { if (tg) { tg.ready(); tg.expand(); } } catch (e) {}

  function go(flags) {
    var P = CanvasRenderingContext2D.prototype;
    if (!flags.lighter) {
      var gco = Object.getOwnPropertyDescriptor(P, 'globalCompositeOperation');
      Object.defineProperty(P, 'globalCompositeOperation', { get: gco.get, set: function (v) { gco.set.call(this, v === 'lighter' ? 'source-over' : v); } });
    }
    if (!flags.shadow) {
      var sb = Object.getOwnPropertyDescriptor(P, 'shadowBlur');
      Object.defineProperty(P, 'shadowBlur', { get: sb.get, set: function () { sb.set.call(this, 0); } });
    }
    if (!flags.grad) {
      P.createRadialGradient = function (x0, y0, r0, x1, y1, r1) { return this.createLinearGradient(x1, y1 - r1, x1, y1 + r1); };
    }
    if (!flags.dpr) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 1; } });
    if (!flags.rooms) {
      // the room layers are 900×1600 canvases; shrink every extra canvas to a quarter of the pixels
      var wd = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width'), hd = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
      Object.defineProperty(HTMLCanvasElement.prototype, 'width', { get: wd.get, set: function (v) { wd.set.call(this, this.id === 'game' ? v : Math.ceil(v / 2)); } });
      Object.defineProperty(HTMLCanvasElement.prototype, 'height', { get: hd.get, set: function (v) { hd.set.call(this, this.id === 'game' ? v : Math.ceil(v / 2)); } });
    }
    var run = { flags: flags, alive: 0, frames: 0, done: false, err: '' }, t0 = Date.now();
    put(run);
    if (flags.raf !== false) {
      var raf = window.requestAnimationFrame.bind(window);
      window.requestAnimationFrame = function (cb) { return raf(function (t) { run.frames++; cb(t); }); };
    } else run.frames = 'не рахувались';
    window.addEventListener('error', function (e) { run.err = String(e.message || e.error); put(run); });
    window.addEventListener('pagehide', function () { run.done = true; put(run); });
    var hud = document.getElementById('hud');
    if (flags.hud === false) hud.remove();
    setInterval(function () {
      run.alive = Math.round((Date.now() - t0) / 100) / 10;
      var cv = document.getElementById('game');
      run.canvas = cv.width + '×' + cv.height + ' px, на екрані ' + cv.style.width + ' × ' + cv.style.height;
      if (window.__pawslingOk) run.canvas += ', перший кадр є';
      put(run);
      if (flags.hud !== false) hud.textContent = run.alive + ' с · ' + run.frames + ' кадрів · ' + cv.width + '×' + cv.height;
    }, 500);
    document.getElementById('panel').remove();
    if (flags.boot) {
      // the same full-screen "Завантаження…" layer and error hooks as in index.html
      var boot = document.createElement('div');
      boot.id = 'boot'; boot.textContent = 'Завантаження…';
      boot.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9;background:#110e22;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font-weight:800';
      document.body.appendChild(boot);
      window.__bootErr = function (err) { run.err = String(err && (err.message || err)); put(run); var b = document.getElementById('boot'); if (b) b.textContent = 'Помилка: ' + run.err; };
    }
    var v = Date.now(), css = document.createElement('link'), jsDone = false;
    css.rel = 'stylesheet'; css.href = 'game.css?v=' + v;
    function loadJs() {
      if (jsDone) return;
      jsDone = true;
      var js = document.createElement('script');
      js.src = 'game.js?v=' + v;
      document.body.appendChild(js);
    }
    if (flags.cssfirst) { css.onload = css.onerror = loadJs; setTimeout(loadJs, 3000); }
    document.head.appendChild(css);
    if (!flags.cssfirst) loadJs();
  }

  // "auto" repeats the real launch: the settings are saved, the page reloads and the game starts at once
  var AUTO = 'pawsling-diag-auto', pending = null;
  try { pending = JSON.parse(localStorage.getItem(AUTO) || 'null'); localStorage.removeItem(AUTO); } catch (e) {}
  if (preset) { go(preset); return; }
  if (pending) { go(pending); return; }
  document.getElementById('go').onclick = function () {
    var flags = {};
    FLAGS.forEach(function (f) { flags[f] = document.getElementById('f-' + f).checked; });
    if (flags.auto) {
      try { localStorage.setItem(AUTO, JSON.stringify(flags)); } catch (e) {}
      location.reload();
    } else go(flags);
  };
})();
</script>
</body>
</html>
